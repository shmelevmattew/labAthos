---
- name: Install GitLab dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - perl
    state: present
    update_cache: true
  tags: [gitlab, packages]

- name: Download GitLab repository install script
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/install/repositories/gitlab/{{ gitlab_edition }}/script.deb.sh"
    dest: "/tmp/gitlab_install_script.deb.sh"
    mode: "0755"
  tags: [gitlab, packages]

- name: Add GitLab APT repository
  ansible.builtin.command: /tmp/gitlab_install_script.deb.sh
  args:
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list
  tags: [gitlab, packages]

- name: Install GitLab CE package
  ansible.builtin.apt:
    name: "{{ gitlab_edition }}"
    state: present
    update_cache: true
  tags: [gitlab, packages]

- name: Configure GitLab external URL
  ansible.builtin.lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "^external_url\\s+['\"]"
    line: "external_url '{{ gitlab_external_url }}'"
  notify: Reconfigure gitlab
  tags: [gitlab, config]

- name: Configure GitLab initial root password
  ansible.builtin.lineinfile:
    path: /etc/gitlab/gitlab.rb
    regexp: "^gitlab_rails\\['initial_root_password'\\]"
    line: "gitlab_rails['initial_root_password'] = '{{ gitlab_root_password }}'"
  notify: Reconfigure gitlab
  tags: [gitlab, config]

- name: Reconfigure GitLab
  ansible.builtin.meta: flush_handlers

- name: Wait for GitLab to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1/-/health"
    headers:
      Host: "{{ gitlab_domain }}"
    status_code: 200
    timeout: 5
  register: gitlab_health
  # Холодный старт GitLab на слабом железе занимает до 5-10 минут
  retries: 60
  delay: 10
  until: gitlab_health.status == 200
  tags: [gitlab]

# initial_root_password из gitlab.rb действует только при первом seed.
# Если первый reconfigure упал на создании админа — root не существует,
# поэтому гарантируем его здесь (создаём или сбрасываем пароль).
- name: Ensure GitLab root user exists with known password
  ansible.builtin.shell: |
    gitlab-rails runner <<'RUBY'
    u = User.find_by(username: "root")
    if u
      if u.valid_password?("{{ gitlab_root_password }}")
        puts "ROOT_OK"
      else
        u.password = "{{ gitlab_root_password }}"
        u.password_confirmation = "{{ gitlab_root_password }}"
        u.save!
        puts "RESET_OK"
      end
    else
      u = User.new(username: "root", email: "root@lab.local", name: "Administrator", admin: true,
                   password: "{{ gitlab_root_password }}",
                   password_confirmation: "{{ gitlab_root_password }}")
      u.skip_confirmation!
      u.build_namespace(name: "root", path: "root")
      u.save!
      if u.persisted?
        puts "CREATED_OK"
      else
        puts "ERROR: " + u.errors.full_messages.join("; ")
      end
    end
    RUBY
  args:
    executable: /bin/bash
  register: gitlab_root_setup
  changed_when: "'ROOT_OK' not in gitlab_root_setup.stdout"
  failed_when: "'ERROR:' in gitlab_root_setup.stdout"
  tags: [gitlab, users]
