---
registry_version: "2.8.3"
registry_domain: "registry.lab.local"
registry_port: 5000

# Пути для данных registry
registry_data_dir: /var/lib/registry
registry_auth_dir: /etc/registry

# Учётка для CI (push/pull)
registry_username: fintech
registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') | default('Registry123!', true) }}"

# Внутренний CA — создаётся ролью; путь к сертификату
registry_ca_key: /etc/registry/ca.key
registry_ca_cert: /etc/registry/ca.crt
registry_server_key: /etc/registry/server.key
registry_server_cert: /etc/registry/server.crt
